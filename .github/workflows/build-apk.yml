name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --console=plain > build.log 2>&1 || {
            echo "=========== MAIN ERROR ==========="
            grep -n -E "^e: |What went wrong|Execution failed|Could not|Duplicate class|error:|requires" -A6 build.log | head -60
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: BilliardAim-debug-apk
          path: app/build/outputs/apk/debug/*.apk
