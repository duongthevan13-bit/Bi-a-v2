      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --console=plain > build.log 2>&1 || {
            echo "=========== LOI CHINH ==========="
            grep -n -E "^e: |What went wrong|Execution failed|Could not|Duplicate class|error:|requires" -A6 build.log | head -60
            exit 1
          }
